name: CI Pipeline Dev

on:
  push:
    branches:
      - dev

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest .

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: 'docker.io/${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Check for critical vulnerabilities
        run: |
          if grep -q '"severity": "CRITICAL"' trivy-results.sarif; then
            echo "Vulnérabilité CRITIQUE détectée ! Arrêt du pipeline"
            exit 1
          fi

  push:
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest

  notify:
    runs-on: ubuntu-latest
    needs: [build, scan, push]
    if: always()
    steps:
      - name: Send email notification
        run: |
          echo "Pipeline CI exécuté avec succès"